<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Logo Wandelweekends Ardennen" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="boog-boven" d="M 70 200 A 130 130 0 0 1 330 200"/>
    <path id="boog-onder" d="M 62 200 A 138 138 0 0 0 338 200"/>
    <clipPath id="binnen"><circle cx="200" cy="200" r="112"/></clipPath>
  </defs>

  <!-- buitenring -->
  <circle cx="200" cy="200" r="196" fill="#1f4d3a"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#dcefd6" stroke-width="2"/>
  <circle cx="200" cy="200" r="116" fill="none" stroke="#dcefd6" stroke-width="2"/>

  <!-- tekst rond -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#ffffff" letter-spacing="5">
    <text font-size="30"><textPath href="#boog-boven" startOffset="50%" text-anchor="middle">WANDELWEEKENDS</textPath></text>
    <text font-size="30" letter-spacing="8"><textPath href="#boog-onder" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">ARDENNEN</textPath></text>
  </g>
  <!-- scheidingspunten links en rechts -->
  <g fill="#9cc58a">
    <path d="M 46 200 l 8 -8 l 8 8 l -8 8 z"/>
    <path d="M 338 200 l 8 -8 l 8 8 l -8 8 z"/>
  </g>

  <!-- landschap binnenin -->
  <g clip-path="url(#binnen)">
    <rect x="80" y="80" width="240" height="240" fill="#f3f7f0"/>
    <!-- zon -->
    <circle cx="245" cy="150" r="20" fill="#e9b949"/>
    <!-- verre bergen -->
    <path d="M 80 235 L 130 175 L 165 210 L 205 160 L 250 215 L 285 185 L 320 225 L 320 320 L 80 320 Z" fill="#8fb39a"/>
    <!-- heuvels -->
    <path d="M 80 260 C 130 225 175 245 210 238 C 250 230 285 245 320 235 L 320 320 L 80 320 Z" fill="#3f7a5a"/>
    <!-- dennen -->
    <g fill="#1f4d3a">
      <path d="M 108 262 l 12 -40 l 12 40 z"/><path d="M 126 258 l 10 -32 l 10 32 z"/>
      <path d="M 270 250 l 12 -42 l 12 42 z"/><path d="M 290 254 l 9 -30 l 9 30 z"/>
    </g>
    <!-- voorgrond -->
    <path d="M 80 285 C 140 268 260 275 320 262 L 320 320 L 80 320 Z" fill="#1f4d3a"/>
    <!-- wandelpad -->
    <path d="M 175 320 C 190 300 205 288 225 280 C 240 274 250 268 255 262" stroke="#f3f7f0" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wandelaar met stok -->
  <g transform="translate(212 236)" fill="#1f4d3a" stroke="#1f4d3a" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-16" r="5" stroke="none"/>
    <path d="M -1 -10 L -3 6" stroke-width="5" fill="none"/>
    <path d="M -3 6 L -9 20 M -3 6 L 3 20" stroke-width="4" fill="none"/>
    <path d="M -1 -6 L 7 0 M -1 -6 L -8 0" stroke-width="3" fill="none"/>
    <path d="M 7 0 L 12 20" stroke="#7a4b3a" stroke-width="2.5" fill="none"/>
    <path d="M -2 -8 l -7 -2 l -2 10 l 7 2 z" fill="#c0892b" stroke="none"/>
  </g>

  <!-- sinds -->
  <text x="200" y="122" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#3f7a5a">SINDS 2022</text>
</svg>
